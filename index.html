<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            text-align: center;
            z-index: 10;
        }

        #startScreen h1, #gameOverScreen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            color: #FFD700;
        }

        #startScreen p, #gameOverScreen p {
            font-size: 24px;
            margin-bottom: 30px;
            max-width: 80%;
        }

        #finalScore {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #00FF00;
        }

        .button {
            background: linear-gradient(180deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .button:hover {
            background: linear-gradient(180deg, #45a049 0%, #388E3C 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.4);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div id="startScreen">
            <h1>Flappy Bird</h1>
            <p>点击屏幕或按空格键让小鸟跳跃<br>穿过管道获得分数</p>
            <button id="startButton" class="button">开始游戏</button>
        </div>
        
        <div id="gameOverScreen" class="hidden">
            <h1>游戏结束</h1>
            <div id="finalScore">得分: 0</div>
            <button id="restartButton" class="button">重新开始</button>
        </div>
    </div>

    <script>
        // 游戏配置
        const config = {
            canvasWidth: 400,
            canvasHeight: 600,
            birdSize: 34,
            birdX: 80,
            gravity: 0.35,
            jumpForce: -7,
            birdCollisionRadius: 12,
            pipeWidth: 60,
            basePipeGap: 150,
            minPipeGap: 100,
            basePipeSpeed: 3,
            maxPipeSpeed: 8,
            pipeInterval: 1500,
            cloudSpeed: 0.8,
            cloudSpawnInterval: 4000,
            groundHeight: 30,
            wingFlapSpeed: 0.15,
            difficultyIncreaseInterval: 5,
            speedIncrease: 0.5,
            gapDecrease: 10
        };

        // 游戏状态
        let gameState = {
            isPlaying: false,
            score: 0,
            bird: {
                y: config.canvasHeight / 2,
                velocity: 0,
                wingAngle: 0,
                wingDirection: 1
            },
            pipes: [],
            lastPipeTime: 0,
            clouds: [],
            lastCloudTime: 0,
            groundOffset: 0,
            particles: [],
            pipeSpeed: config.basePipeSpeed,
            pipeGap: config.basePipeGap,
            difficultyLevel: 0
        };

        // 获取DOM元素
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startButton = document.getElementById('startButton');
        const restartButton = document.getElementById('restartButton');
        const finalScoreElement = document.getElementById('finalScore');

        // 设置Canvas尺寸
        canvas.width = config.canvasWidth;
        canvas.height = config.canvasHeight;

        // 绘制小鸟
        function drawBird() {
            ctx.save();
            ctx.translate(config.birdX + config.birdSize / 2, gameState.bird.y + config.birdSize / 2);
            
            // 计算旋转角度（根据速度）
            const rotation = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, gameState.bird.velocity * 0.05));
            ctx.rotate(rotation);
            
            // 小鸟身体
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(0, 0, config.birdSize / 2, 0, Math.PI * 2);
            ctx.fill();
            
            // 小鸟翅膀（添加扑翼动画）
            ctx.save();
            ctx.translate(-8, 0);
            ctx.rotate(gameState.bird.wingAngle);
            ctx.fillStyle = '#FFA500';
            ctx.beginPath();
            ctx.ellipse(0, 5, 10, 6, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            
            // 小鸟眼睛
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(8, -5, 6, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(10, -5, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // 小鸟喙
            ctx.fillStyle = '#FF6347';
            ctx.beginPath();
            ctx.moveTo(12, 0);
            ctx.lineTo(20, 3);
            ctx.lineTo(12, 6);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }
        
        // 更新小鸟翅膀动画
        function updateWingAnimation() {
            // 更新翅膀角度
            gameState.bird.wingAngle += gameState.bird.wingDirection * config.wingFlapSpeed;
            
            // 限制翅膀角度范围，实现上下摆动
            if (gameState.bird.wingAngle > 0.3 || gameState.bird.wingAngle < -0.3) {
                gameState.bird.wingDirection *= -1;
            }
        }
        
        // 生成云朵
        function generateCloud() {
            const cloud = {
                x: config.canvasWidth,
                y: Math.random() * (config.canvasHeight - 200) + 30,
                size: Math.random() * 15 + 25,
                opacity: Math.random() * 0.4 + 0.6
            };
            return cloud;
        }
        
        // 绘制云朵
        function drawClouds() {
            gameState.clouds.forEach(cloud => {
                ctx.save();
                ctx.globalAlpha = cloud.opacity;
                ctx.fillStyle = 'white';
                
                // 绘制云朵（多个圆形组合）
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.6, cloud.y - cloud.size * 0.3, cloud.size * 0.7, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 1.2, cloud.y, cloud.size * 0.8, 0, Math.PI * 2);
                ctx.arc(cloud.x + cloud.size * 0.6, cloud.y + cloud.size * 0.2, cloud.size * 0.6, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            });
        }
        
        // 绘制滚动地面
        function drawGround() {
            // 地面
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, config.canvasHeight - config.groundHeight, config.canvasWidth, config.groundHeight);
            
            // 草地
            ctx.fillStyle = '#32CD32';
            ctx.fillRect(0, config.canvasHeight - config.groundHeight - 10, config.canvasWidth, 10);
            
            // 地面纹理（滚动的线条）
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.lineWidth = 2;
            
            // 绘制多条垂直线条
            const lineSpacing = 20;
            const startX = gameState.groundOffset % lineSpacing;
            
            for (let x = startX; x < config.canvasWidth; x += lineSpacing) {
                ctx.beginPath();
                ctx.moveTo(x, config.canvasHeight - config.groundHeight);
                ctx.lineTo(x, config.canvasHeight);
                ctx.stroke();
            }
            
            ctx.restore();
        }

        // 绘制管道
        function drawPipes() {
            gameState.pipes.forEach(pipe => {
                // 上管道
                ctx.fillStyle = '#228B22';
                ctx.fillRect(pipe.x, 0, config.pipeWidth, pipe.topHeight);
                
                // 上管道头部
                ctx.fillStyle = '#32CD32';
                ctx.fillRect(pipe.x - 5, pipe.topHeight - 30, config.pipeWidth + 10, 30);
                
                // 下管道
                ctx.fillStyle = '#228B22';
                ctx.fillRect(pipe.x, pipe.bottomY, config.pipeWidth, config.canvasHeight - pipe.bottomY);
                
                // 下管道头部
                ctx.fillStyle = '#32CD32';
                ctx.fillRect(pipe.x - 5, pipe.bottomY, config.pipeWidth + 10, 30);
            });
        }

        // 绘制背景
        function drawBackground() {
            // 天空渐变
            const gradient = ctx.createLinearGradient(0, 0, 0, config.canvasHeight);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#E0F6FF');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, config.canvasWidth, config.canvasHeight);
            
            // 绘制云朵
            drawClouds();
            
            // 绘制滚动地面
            drawGround();
        }

        // 绘制分数
        function drawScore() {
            ctx.fillStyle = 'white';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText(gameState.score.toString(), config.canvasWidth / 2, 50);
            
            // 添加阴影效果
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 3;
            ctx.strokeText(gameState.score.toString(), config.canvasWidth / 2, 50);
        }

        // 生成管道
        function generatePipe() {
            const minHeight = 80;
            const maxHeight = config.canvasHeight - gameState.pipeGap - minHeight - 20;
            const topHeight = Math.random() * (maxHeight - minHeight) + minHeight;
            
            return {
                x: config.canvasWidth,
                topHeight: topHeight,
                bottomY: topHeight + gameState.pipeGap,
                passed: false
            };
        }
        
        // 增加难度
        function increaseDifficulty() {
            // 检查是否达到难度增加间隔
            if (gameState.score % config.difficultyIncreaseInterval === 0 && gameState.score > 0) {
                // 计算新的难度级别
                const newDifficultyLevel = Math.floor(gameState.score / config.difficultyIncreaseInterval);
                
                // 只有当难度级别增加时才调整参数
                if (newDifficultyLevel > gameState.difficultyLevel) {
                    gameState.difficultyLevel = newDifficultyLevel;
                    
                    // 增加管道速度（限制最大值）
                    gameState.pipeSpeed = Math.min(
                        gameState.pipeSpeed + config.speedIncrease,
                        config.maxPipeSpeed
                    );
                    
                    // 缩小管道间隙（限制最小值）
                    gameState.pipeGap = Math.max(
                        gameState.pipeGap - config.gapDecrease,
                        config.minPipeGap
                    );
                    
                    console.log(`难度增加！速度: ${gameState.pipeSpeed.toFixed(1)}, 间隙: ${gameState.pipeGap}`);
                }
            }
        }

        // 检测圆形与矩形的碰撞
        function circleRectCollision(circleX, circleY, radius, rectLeft, rectTop, rectWidth, rectHeight) {
            // 找到矩形中距离圆心最近的点
            const closestX = Math.max(rectLeft, Math.min(circleX, rectLeft + rectWidth));
            const closestY = Math.max(rectTop, Math.min(circleY, rectTop + rectHeight));
            
            // 计算距离
            const distanceX = circleX - closestX;
            const distanceY = circleY - closestY;
            const distanceSquared = (distanceX * distanceX) + (distanceY * distanceY);
            
            return distanceSquared < (radius * radius);
        }

        // 检测碰撞
        function checkCollision() {
            // 小鸟中心点
            const birdCenterX = config.birdX + config.birdSize / 2;
            const birdCenterY = gameState.bird.y + config.birdSize / 2;
            const radius = config.birdCollisionRadius;
            
            // 边界检测
            if (birdCenterY - radius < 0 || 
                birdCenterY + radius > config.canvasHeight - 30) {
                return true;
            }
            
            // 管道碰撞检测
            for (const pipe of gameState.pipes) {
                // 上管道
                const topPipeCollision = circleRectCollision(
                    birdCenterX, birdCenterY, radius,
                    pipe.x, 0, config.pipeWidth, pipe.topHeight
                );
                
                // 下管道
                const bottomPipeCollision = circleRectCollision(
                    birdCenterX, birdCenterY, radius,
                    pipe.x, pipe.bottomY, config.pipeWidth, config.canvasHeight - pipe.bottomY
                );
                
                if (topPipeCollision || bottomPipeCollision) {
                    return true;
                }
            }
            
            return false;
        }

        // 更新游戏状态
        function updateGame() {
            if (!gameState.isPlaying) return;
            
            // 更新小鸟
            gameState.bird.velocity += config.gravity;
            gameState.bird.y += gameState.bird.velocity;
            
            // 更新小鸟翅膀动画
            updateWingAnimation();
            
            // 更新地面滚动
            gameState.groundOffset += gameState.pipeSpeed;
            
            // 更新云朵
            const currentTime = Date.now();
            
            // 生成新云朵
            if (currentTime - gameState.lastCloudTime > config.cloudSpawnInterval) {
                gameState.clouds.push(generateCloud());
                gameState.lastCloudTime = currentTime;
            }
            
            // 移动云朵
            gameState.clouds.forEach(cloud => {
                cloud.x -= config.cloudSpeed;
            });
            
            // 移除屏幕外的云朵
            gameState.clouds = gameState.clouds.filter(cloud => cloud.x + cloud.size * 2 > 0);
            
            // 更新管道
            if (currentTime - gameState.lastPipeTime > config.pipeInterval) {
                gameState.pipes.push(generatePipe());
                gameState.lastPipeTime = currentTime;
            }
            
            // 移动管道并检测得分
            gameState.pipes.forEach(pipe => {
                pipe.x -= gameState.pipeSpeed;
                
                // 检测是否穿过管道
                if (!pipe.passed && pipe.x + config.pipeWidth < config.birdX) {
                    pipe.passed = true;
                    gameState.score++;
                    createScoreParticles(); // 得分时创建粒子效果
                    audioManager.playScoreSound(); // 播放得分音效
                    increaseDifficulty(); // 检查并增加难度
                }
            });
            
            // 更新粒子
            updateParticles();
            
            // 移除屏幕外的管道
            gameState.pipes = gameState.pipes.filter(pipe => pipe.x + config.pipeWidth > 0);
            
            // 检测碰撞
            if (checkCollision()) {
                gameOver();
            }
        }

        // 渲染游戏
        function renderGame() {
            // 清空画布
            ctx.clearRect(0, 0, config.canvasWidth, config.canvasHeight);
            
            // 绘制背景
            drawBackground();
            
            // 绘制管道
            drawPipes();
            
            // 绘制小鸟
            drawBird();
            
            // 绘制粒子
            drawParticles();
            
            // 绘制分数
            drawScore();
        }

        // 游戏循环
        function gameLoop() {
            updateGame();
            renderGame();
            
            if (gameState.isPlaying) {
                requestAnimationFrame(gameLoop);
            }
        }

        // 音频管理器
        const audioManager = {
            audioContext: null,
            
            init: function() {
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.log('Web Audio API not supported');
                }
            },
            
            playJumpSound: function() {
                if (!this.audioContext) return;
                
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);
                
                // 设置频率和音量
                oscillator.frequency.setValueAtTime(300, this.audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(600, this.audioContext.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.15);
                
                oscillator.type = 'sine';
                oscillator.start(this.audioContext.currentTime);
                oscillator.stop(this.audioContext.currentTime + 0.15);
            },
            
            playScoreSound: function() {
                if (!this.audioContext) return;
                
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);
                
                // 设置频率和音量
                oscillator.frequency.setValueAtTime(500, this.audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(800, this.audioContext.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.2, this.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.2);
                
                oscillator.type = 'square';
                oscillator.start(this.audioContext.currentTime);
                oscillator.stop(this.audioContext.currentTime + 0.2);
            },
            
            playDeathSound: function() {
                if (!this.audioContext) return;
                
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);
                
                // 设置频率和音量
                oscillator.frequency.setValueAtTime(300, this.audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(50, this.audioContext.currentTime + 0.3);
                
                gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.4);
                
                oscillator.type = 'sawtooth';
                oscillator.start(this.audioContext.currentTime);
                oscillator.stop(this.audioContext.currentTime + 0.4);
            }
        };
        
        // 粒子系统
        function createScoreParticles() {
            const particleCount = 15;
            
            for (let i = 0; i < particleCount; i++) {
                gameState.particles.push({
                    x: config.birdX + config.birdSize / 2,
                    y: gameState.bird.y + config.birdSize / 2,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1.0,
                    color: `hsl(${Math.random() * 60 + 30}, 100%, 50%)`,
                    size: Math.random() * 5 + 2
                });
            }
        }
        
        function updateParticles() {
            for (let i = gameState.particles.length - 1; i >= 0; i--) {
                const particle = gameState.particles[i];
                
                // 更新位置
                particle.x += particle.vx;
                particle.y += particle.vy;
                
                // 应用重力
                particle.vy += 0.1;
                
                // 减少生命值
                particle.life -= 0.02;
                
                // 移除死亡粒子
                if (particle.life <= 0) {
                    gameState.particles.splice(i, 1);
                }
            }
        }
        
        function drawParticles() {
            gameState.particles.forEach(particle => {
                ctx.save();
                ctx.globalAlpha = particle.life;
                ctx.fillStyle = particle.color;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }
        
        // 开始游戏
        function startGame() {
            // 初始化音频上下文（用户交互时）
            if (!audioManager.audioContext) {
                audioManager.init();
            }
            
            gameState = {
                isPlaying: true,
                score: 0,
                bird: {
                    y: config.canvasHeight / 2,
                    velocity: 0,
                    wingAngle: 0,
                    wingDirection: 1
                },
                pipes: [],
                lastPipeTime: Date.now(),
                clouds: [],
                lastCloudTime: Date.now(),
                groundOffset: 0,
                particles: [],
                pipeSpeed: config.basePipeSpeed,
                pipeGap: config.basePipeGap,
                difficultyLevel: 0
            };
            
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            // 初始化云朵
            for (let i = 0; i < 3; i++) {
                const cloud = generateCloud();
                cloud.x = Math.random() * config.canvasWidth;
                gameState.clouds.push(cloud);
            }
            
            gameLoop();
        }

        // 游戏结束
        function gameOver() {
            gameState.isPlaying = false;
            audioManager.playDeathSound(); // 播放死亡音效
            finalScoreElement.textContent = `得分: ${gameState.score}`;
            gameOverScreen.classList.remove('hidden');
        }

        // 小鸟跳跃
        function birdJump() {
            if (!gameState.isPlaying) return;
            
            gameState.bird.velocity = config.jumpForce;
            audioManager.playJumpSound(); // 播放跳跃音效
        }

        // 事件监听器
        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', startGame);

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!gameState.isPlaying && !startScreen.classList.contains('hidden')) {
                    startGame();
                } else if (!gameState.isPlaying && !gameOverScreen.classList.contains('hidden')) {
                    startGame();
                } else {
                    birdJump();
                }
            }
        });

        // 点击事件
        canvas.addEventListener('click', () => {
            if (gameState.isPlaying) {
                birdJump();
            }
        });

        // 初始渲染
        renderGame();
    </script>
</body>
</html>
